# lys-lib CI: every gate `just gates` runs (formatting, vet, lint, test,
# build, the race detector, the GPU tests on lavapipe and the
# compositor-in-the-loop capture and virtual input suite against a
# headless sway with LYS_TEST_HEADLESS=1).
#
# Everything runs in the flake's dev shell (nix/shell.nix, pinned by
# flake.lock): the Go toolchain, golangci-lint, just, sway, Mesa's
# lavapipe and the Vulkan validation layer, and the PipeWire daemon and
# libei the pipewire and eis tests run against. No display server and
# no GPU are needed.
name: ci

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gates (formatting, vet, lint, test, build, race, GPU, headless)
        run: nix develop -c just gates
