# lys-lib CI: the release gates, the race detector, the GPU tests on
# lavapipe and the compositor-in-the-loop capture and virtual input
# suite against a headless sway (LYS_TEST_HEADLESS=1).
#
# Everything runs in the flake's dev shell (nix/shell.nix, pinned by
# flake.lock): the Go toolchain, golangci-lint, just, sway, Mesa's
# lavapipe and the Vulkan validation layer, and the PipeWire daemon and
# libei the pipewire and eis tests run against. No display server and
# no GPU are needed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: formatting gate
        run: nix develop -c just fmt-check
      - name: Release gates (vet, lint, test)
        run: nix develop -c just check
      - name: Race detector gate
        run: nix develop -c just race
      - name: GPU on lavapipe
        run: nix develop -c just gpu
      - name: Headless compositor gate
        run: nix develop -c just headless
